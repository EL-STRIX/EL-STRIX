[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "el-strix"
version = "0.1.0"
description = "GitHub Profile Banner & Dynamic Content Engine"
readme = "README.md"
authors = [
    { name = "EL-STRIX" }
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
