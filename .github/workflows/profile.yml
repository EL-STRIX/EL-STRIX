name: EL-STRIX Automation Engine

on:
  schedule:
    - cron: '0 0 * * *' # Run every 24 hours at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'assets/**'
      - 'generated/**'

# Prevent multiple concurrent workflow runs
concurrency:
  group: profile-update
  cancel-in-progress: true

jobs:
  automation-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.EL_STRIX_TOKEN || secrets.GH_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Test Suite
        env:
          GH_TOKEN: "mock_token_for_ci_tests"
          GITHUB_USERNAME: "EL-STRIX"
        run: |
          pytest

      - name: Execute Automation Engine (Phase 01-07)
        env:
          GH_TOKEN: ${{ secrets.EL_STRIX_TOKEN || secrets.GH_TOKEN || github.token }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTIONS: "true"
        run: |
          python scripts/main.py
