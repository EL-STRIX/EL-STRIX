<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="850" height="280">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="850" height="280" rx="12" fill="url(#bg-gradient)" />

  <!-- Profile Name -->
  <text x="50" y="80" fill="#58a6ff" font-family="'Segoe UI',Arial,sans-serif" font-size="36" font-weight="700">
    {{ name }}
  </text>

  <!-- Bio -->
  <text x="50" y="120" fill="#8b949e" font-family="'Segoe UI',Arial,sans-serif" font-size="16">
    {{ bio }}
  </text>

  <!-- Stats Row -->
  <text x="50" y="180" fill="#c9d1d9" font-family="'Segoe UI',Arial,sans-serif" font-size="14">
    ⭐ {{ total_stars }} Stars  •  🍴 {{ total_forks }} Forks  •  📦 {{ public_repos }} Repos
  </text>

  <!-- Followers -->
  <text x="50" y="220" fill="#8b949e" font-family="'Segoe UI',Arial,sans-serif" font-size="13">
    👥 {{ followers }} Followers  •  {{ following }} Following
  </text>

  <!-- Branding -->
  <text x="750" y="260" fill="#30363d" font-family="monospace" font-size="11" text-anchor="end">
    EL-STRIX Engine
  </text>
</svg>
